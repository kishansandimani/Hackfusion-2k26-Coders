<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChipPal – sign in</title>
<style>
#bg-wrap{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;will-change:transform;animation:drift 24s ease-in-out infinite alternate}
.b1{width:56vmax;height:56vmax;left:-16vmax;top:-18vmax;background:radial-gradient(circle,rgba(255,101,132,.42) 0,rgba(255,101,132,0) 66%)}
.b2{width:50vmax;height:50vmax;right:-14vmax;top:14vh;animation-duration:30s;animation-delay:-7s;background:radial-gradient(circle,rgba(100,252,201,.46) 0,rgba(100,252,201,0) 66%)}
.b3{width:48vmax;height:48vmax;left:16vw;bottom:-22vmax;animation-duration:27s;animation-delay:-13s;background:radial-gradient(circle,rgba(138,164,255,.42) 0,rgba(138,164,255,0) 66%)}
.b4{width:34vmax;height:34vmax;right:20vw;top:-12vmax;animation-duration:33s;animation-delay:-3s;background:radial-gradient(circle,rgba(237,193,87,.4) 0,rgba(237,193,87,0) 66%)}
@keyframes drift{to{transform:translate(7vmax,6vmax) scale(1.14)}}
#bg-canvas{position:absolute;inset:0;width:100%;height:100%}
.fchip{position:absolute;bottom:-70px;opacity:.55;will-change:transform;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-125vh) rotate(200deg)}}
@media (prefers-reduced-motion:reduce){.blob,.fchip{animation:none}.fchip{display:none}}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#faf8ff;color:#171b2b;font-family:ui-rounded,"Nunito","Varela Round","Trebuchet MS","Segoe UI",sans-serif}
.card{width:100%;max-width:440px;background:#fff;border:3px solid #ffd0de;border-radius:32px;padding:30px 28px 26px;box-shadow:0 18px 50px rgba(255,101,132,.18);animation:pop .6s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.97)}}
.mascot{display:block;width:96px;margin:-62px auto 6px;animation:bob 2.4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px) rotate(3deg)}}
h1{margin:0;text-align:center;font-size:1.7rem;line-height:1.2}
.sub{margin:6px 0 20px;text-align:center;color:#5d6178}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f1efff;border-radius:999px;padding:5px;margin-bottom:18px}
.tabs button{border:0;border-radius:999px;padding:10px;font:inherit;font-weight:800;color:#5d6178;background:transparent;cursor:pointer}
.tabs button[aria-selected=true]{background:#ff6584;color:#fff}
label{display:block;font-weight:700;margin:14px 0 6px}
.field{position:relative}
input{width:100%;font:inherit;padding:13px 16px;border-radius:18px;border:2px solid #d9d6ee;background:#fcfbff;color:#171b2b}
input:focus{outline:3px solid #8aa4ff;outline-offset:1px;border-color:#8aa4ff}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-weight:800;color:#5d6178;cursor:pointer;padding:8px 10px;border-radius:999px}
.go{width:100%;margin-top:22px;border:0;border-radius:999px;padding:14px;font:inherit;font-size:1.05rem;font-weight:800;background:#ff6584;color:#fff;cursor:pointer;box-shadow:0 6px 0 #d94c6c;transition:.12s}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #d94c6c}
.go:disabled{opacity:.6;cursor:wait}
.go:focus-visible,.tabs button:focus-visible,.eye:focus-visible{outline:3px solid #171b2b;outline-offset:2px}
.msg{min-height:24px;margin-top:14px;text-align:center;font-weight:700}
.msg.err{color:#b4234f}.msg.ok{color:#1f8f5f}
.note{margin:16px 0 0;text-align:center;font-size:.82rem;color:#5d6178}
.reg{display:none}.card.signup .reg{display:block}
</style>
</head>
<body>
<main class="card" id="card">
  <svg class="mascot" viewBox="0 0 150 150" aria-hidden="true"><g stroke="#171b2b" stroke-width="6" stroke-linecap="round" fill="none"><path d="M45 28V12M75 28V8M105 28V12M45 122v16M75 122v18M105 122v16M24 55H8M24 95H8M126 55h16M126 95h16"/><rect x="24" y="28" width="102" height="94" rx="24" fill="#ff6584"/></g><circle cx="58" cy="70" r="12" fill="#fff"/><circle cx="92" cy="70" r="12" fill="#fff"/><circle cx="60" cy="72" r="6" fill="#171b2b"/><circle cx="94" cy="72" r="6" fill="#171b2b"/><path d="M62 98q13 12 26 0" fill="none" stroke="#171b2b" stroke-width="6" stroke-linecap="round"/></svg>
  <h1 id="title">Welcome back!</h1>
  <p class="sub" id="sub">Sign in to scan boards with ChipPal.</p>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="t-in" aria-selected="true">Sign in</button>
    <button type="button" role="tab" id="t-up" aria-selected="false">Create account</button>
  </div>
  <form id="form" novalidate>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required maxlength="20">
    <label for="p">Password</label>
    <div class="field"><input id="p" name="password" type="password" autocomplete="current-password" required><button class="eye" type="button" id="eye" aria-label="Show password">Show</button></div>
    <div class="reg"><label for="c">Team code</label><input id="c" name="invite" autocomplete="off" placeholder="Ask your team lead"></div>
    <button class="go" id="go" type="submit">Sign in</button>
    <div class="msg" id="msg" role="alert" aria-live="polite"></div>
  </form>
  <p class="note">Estimates only. ChipPal is a college hackathon prototype.</p>
</main>
<script>
const $=s=>document.querySelector(s);let mode='in';
function setMode(m){mode=m;const up=m==='up';$('#card').classList.toggle('signup',up);$('#t-in').setAttribute('aria-selected',!up);$('#t-up').setAttribute('aria-selected',up);
  $('#title').textContent=up?'Join the team!':'Welcome back!';$('#sub').textContent=up?'Create your account with the team code.':'Sign in to scan boards with ChipPal.';
  $('#go').textContent=up?'Create account':'Sign in';$('#p').autocomplete=up?'new-password':'current-password';$('#msg').textContent='';$('#msg').className='msg';}
$('#t-in').onclick=()=>setMode('in');$('#t-up').onclick=()=>setMode('up');
$('#eye').onclick=()=>{const p=$('#p'),show=p.type==='password';p.type=show?'text':'password';$('#eye').textContent=show?'Hide':'Show';$('#eye').setAttribute('aria-label',show?'Hide password':'Show password');};
$('#form').onsubmit=async e=>{
  e.preventDefault();const msg=$('#msg'),go=$('#go');msg.className='msg';
  if(!$('#u').value.trim()||!$('#p').value){msg.textContent='Please fill in your username and password.';msg.classList.add('err');return;}
  if(mode==='up'&&!$('#c').value.trim()){msg.textContent='Please enter the team code.';msg.classList.add('err');return;}
  const fd=new FormData();fd.append('username',$('#u').value.trim());fd.append('password',$('#p').value);if(mode==='up')fd.append('invite',$('#c').value);
  go.disabled=true;const label=go.textContent;go.textContent='One moment...';
  try{const r=await fetch(mode==='up'?'/api/register':'/api/login',{method:'POST',body:fd,credentials:'same-origin'}),d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'Something went wrong. Check the form and try again.');
    msg.textContent='Welcome, '+d.name+'!';msg.classList.add('ok');location.href='/';
  }catch(err){msg.textContent=err.message;msg.classList.add('err');go.disabled=false;go.textContent=label;}
};
(()=>{
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wrap=document.createElement('div');wrap.id='bg-wrap';
wrap.innerHTML='<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div><canvas id="bg-canvas"></canvas>';
document.body.prepend(wrap);
// floating chips
const COL=['#ff6584','#2fb67c','#8aa4ff','#edc157'];
const svg=c=>'<svg viewBox="0 0 40 40" width="100%" height="100%"><g stroke="'+c+'" stroke-width="3" stroke-linecap="round"><path d="M12 4v5M20 4v5M28 4v5M12 31v5M20 31v5M28 31v5M4 12h5M4 20h5M4 28h5M31 12h5M31 20h5M31 28h5"/><rect x="9" y="9" width="22" height="22" rx="6" fill="'+c+'" fill-opacity=".25"/></g><circle cx="16" cy="18" r="2.2" fill="'+c+'"/><circle cx="24" cy="18" r="2.2" fill="'+c+'"/></svg>';
const n=innerWidth<700?6:11;
for(let i=0;i<n;i++){const d=document.createElement('div'),s=22+Math.random()*30;d.className='fchip';
  d.style.cssText='left:'+Math.random()*96+'%;width:'+s+'px;height:'+s+'px;animation-duration:'+(30+Math.random()*34)+'s;animation-delay:-'+Math.random()*50+'s';
  d.innerHTML=svg(COL[i%4]);wrap.append(d);}
// circuit traces with travelling pulses
const cv=wrap.querySelector('canvas'),cx=cv.getContext('2d');
let W=0,H=0,traces=[],pulses=[],last=0,raf=0;const G=48;
function build(){
  const dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  traces=[];pulses=[];const count=Math.max(7,Math.min(24,Math.round(W*H/80000)));
  for(let i=0;i<count;i++){
    let x=Math.round(Math.random()*W/G)*G,y=Math.round(Math.random()*H/G)*G,dir=Math.random()<.5?0:1;const pts=[[x,y]],L=[];let total=0;
    for(let s=0,k=3+Math.floor(Math.random()*4);s<k;s++){const len=(2+Math.floor(Math.random()*5))*G*(Math.random()<.5?-1:1);
      if(dir===0)x+=len;else y+=len;pts.push([x,y]);L.push(Math.abs(len));total+=Math.abs(len);dir=1-dir;}
    const tr={pts,L,total,col:COL[i%4]};traces.push(tr);pulses.push({d:Math.random()*total,sp:45+Math.random()*55,tr});
  }
}
function pos(tr,d){let k=0;while(k<tr.L.length-1&&d>tr.L[k]){d-=tr.L[k];k++;}const a=tr.pts[k],b=tr.pts[k+1],t=Math.min(d/tr.L[k],1);return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}
function draw(dt){
  cx.clearRect(0,0,W,H);cx.lineJoin='round';cx.lineWidth=2;
  traces.forEach(tr=>{cx.globalAlpha=.2;cx.strokeStyle=tr.col;cx.beginPath();tr.pts.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.stroke();
    [tr.pts[0],tr.pts[tr.pts.length-1]].forEach(p=>{cx.beginPath();cx.arc(p[0],p[1],5,0,6.283);cx.stroke();});});
  if(reduce)return;
  pulses.forEach(p=>{p.d+=p.sp*dt;if(p.d>p.tr.total)p.d-=p.tr.total;const[x,y]=pos(p.tr,p.d);
    cx.fillStyle=p.tr.col;cx.globalAlpha=.22;cx.beginPath();cx.arc(x,y,10,0,6.283);cx.fill();cx.globalAlpha=.9;cx.beginPath();cx.arc(x,y,3.6,0,6.283);cx.fill();});
  cx.globalAlpha=1;
}
function loop(t){const dt=Math.min((t-last)/1000||0,.05);last=t;draw(dt);raf=requestAnimationFrame(loop);}
function start(){cancelAnimationFrame(raf);last=performance.now();if(reduce)draw(0);else raf=requestAnimationFrame(loop);}
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else start();});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(Math.abs(innerWidth-W)>40||Math.abs(innerHeight-H)>200){build();start();}},250);});
build();start();
})();

</script>
</body>
</html>
